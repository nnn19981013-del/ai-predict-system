<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AI預測系統｜正式會員數據系統</title>
<style>
:root {
  --bg:#05070d; --panel:#12141c; --panel2:#0d1d20; --line:rgba(255,255,255,.10);
  --text:#f8fafc; --muted:#a8bed8; --green:#16d6a3; --blue:#38bdf8; --yellow:#facc15;
  --red:#fb7185; --chip:#202532;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#080a13;border-right:1px solid var(--line);padding:18px 14px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:1000;color:#062018;background:linear-gradient(135deg,#e7ff65,#14d7a3)}
.brand h1{margin:0;font-size:18px;line-height:1.2}
.brand p{margin:4px 0 0;color:#7892b4;font-weight:800;font-size:13px}
.nav-title{margin:18px 10px 8px;color:#6d86a5;font-size:12px;font-weight:900;letter-spacing:.12em}
.nav button{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#eef5ff;border-radius:15px;padding:13px 14px;margin:4px 0;font-weight:950;cursor:pointer;text-align:left}
.nav button:hover,.nav button.active{background:rgba(22,214,163,.13);color:#9dffe2}
.nav button.locked{opacity:.58}
.side-note{margin-top:26px;border:1px solid rgba(56,189,248,.22);background:rgba(56,189,248,.07);border-radius:16px;padding:14px;line-height:1.7;color:#d9ecff;font-size:13px}
.main{min-width:0}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(5,7,13,.92);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}
.topbar h2{font-size:22px;margin:0}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;border:1px solid rgba(22,214,163,.35);background:rgba(22,214,163,.10);color:#9dffe2;border-radius:999px;padding:10px 15px;font-weight:1000}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:1000;cursor:pointer}
.btn.primary{background:var(--green);color:#04160f}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.btn.warn{background:rgba(250,204,21,.15);color:#fde68a;border:1px solid rgba(250,204,21,.25)}
.btn.danger{background:rgba(251,113,133,.14);color:#ffb3c0;border:1px solid rgba(251,113,133,.22)}
.content{padding:28px;max-width:1180px}
.hero{border:1px solid var(--line);background:linear-gradient(135deg,rgba(22,214,163,.15),rgba(20,25,38,.94));border-radius:30px;padding:38px;margin-bottom:22px}
.pill{display:inline-flex;border:1px solid rgba(22,214,163,.35);background:rgba(22,214,163,.12);color:#9dffe2;border-radius:999px;padding:8px 14px;font-weight:1000;margin-bottom:16px}
.hero h1,.hero h2{font-size:54px;line-height:1.05;margin:0 0 16px}
.hero p,.muted{color:var(--muted);line-height:1.85}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:24px;margin:18px 0;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:22px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:28px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pad{padding:22px}
.card{border:1px solid rgba(22,214,163,.22);background:linear-gradient(135deg,rgba(22,214,163,.09),rgba(18,20,28,.92));border-radius:24px;padding:20px}
.card h3{font-size:27px;margin:0 0 8px}
.meta{color:#9fc0df;font-weight:800;font-size:14px;line-height:1.75}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tag{display:inline-flex;border-radius:999px;background:rgba(255,255,255,.09);padding:7px 11px;font-weight:950;font-size:13px;color:#e6f4ff}
.tag.green{background:rgba(22,214,163,.16);color:#8cffdf}
.status{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 13px;font-weight:1000}
.status.win{background:rgba(22,214,163,.18);color:#70ffd7}
.status.loss{background:rgba(251,113,133,.18);color:#ff9aac}
.status.pending{background:rgba(148,163,184,.18);color:#e5edf7}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.045);border-radius:18px;padding:15px}
.kpi span{display:block;color:#93accb;font-size:12px;font-weight:900;margin-bottom:6px}
.kpi b{font-size:24px}
.details{border:1px solid rgba(255,255,255,.10);background:#0b0f19;border-radius:16px;margin-top:12px;overflow:hidden}
.details summary{cursor:pointer;list-style:none;padding:14px 16px;color:#83ffdc;font-weight:1000}
.details summary::-webkit-details-marker{display:none}
.details div{padding:0 16px 16px;white-space:pre-wrap;line-height:1.9;color:#e8f2ff}
.parlay{border:1px solid rgba(250,204,21,.25);background:linear-gradient(135deg,rgba(250,204,21,.09),rgba(22,214,163,.07),rgba(18,20,28,.95));border-radius:26px;padding:22px;margin:18px 0}
.parlay h3{font-size:31px;margin:0 0 8px}
.leg{display:grid;grid-template-columns:90px 1fr 120px;gap:12px;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding:14px 0}
.leg:first-of-type{border-top:0}
.leg-no{font-weight:1000;color:var(--yellow)}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.metric{border:1px solid rgba(22,214,163,.22);background:linear-gradient(135deg,rgba(22,214,163,.10),rgba(18,20,28,.9));border-radius:22px;padding:18px}
.metric b{display:block;font-size:35px}
.metric span{display:block;color:#9fb7d5;font-weight:900;margin-top:8px}
.meter{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.meter div{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:999px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:22px}
.form label{display:grid;gap:7px;color:#bdd8f5;font-weight:950}
.form input,.form select,.form textarea{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.28);color:#fff;border-radius:15px;padding:12px;font-weight:800}
.form textarea{grid-column:1/-1;min-height:120px}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:0 22px 22px}
.member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;padding:22px}
.member-card{border:1px solid rgba(22,214,163,.20);background:rgba(22,214,163,.06);border-radius:22px;padding:18px}
.member-card h3{font-size:26px;margin:0}
.searchbar{padding:18px 22px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:13px 16px;font-weight:900}
.notice{border:1px solid rgba(250,204,21,.28);background:rgba(250,204,21,.09);border-radius:18px;padding:16px;margin:16px 0;color:#fff7db;line-height:1.8}
.error{border:1px solid rgba(251,113,133,.35);background:rgba(251,113,133,.10);border-radius:18px;padding:16px;margin:16px 0;color:#ffd8df;line-height:1.8}
.empty{padding:40px;text-align:center;color:#9fb7d5}
.mobile-menu{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.64);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.open{display:flex}
.dialog{width:min(520px,100%);background:#111722;border:1px solid var(--line);border-radius:24px;padding:24px}
.dialog h2{margin:0 0 14px}
.dialog input{width:100%;margin:8px 0;border:1px solid var(--line);background:#070a11;color:#fff;border-radius:14px;padding:13px}
@media(max-width:860px){
  .app{display:block}
  .sidebar{position:fixed;inset:0 auto 0 0;width:82vw;max-width:320px;transform:translateX(-105%);transition:.22s;z-index:100}
  body.menu-open .sidebar{transform:translateX(0)}
  .topbar{height:auto;min-height:78px;padding:16px;align-items:flex-start;flex-direction:column}
  .content{padding:18px 14px 90px}
  .hero{padding:26px 20px;border-radius:24px}
  .hero h1,.hero h2{font-size:36px}
  .leg{grid-template-columns:1fr;gap:6px}
  .card-top{align-items:stretch}
  .mobile-menu{display:inline-flex;position:fixed;right:18px;bottom:72px;z-index:110;border:0;border-radius:999px;padding:15px 18px;font-weight:1000;background:linear-gradient(135deg,var(--green),var(--blue));color:#04160f;box-shadow:0 15px 40px rgba(0,0,0,.35)}
  .kpis{grid-template-columns:1fr 1fr}
  .card h3,.panel-head h2{font-size:24px}
}
@media(max-width:520px){.dashboard,.kpis{grid-template-columns:1fr}.top-actions{width:100%}.btn,.badge{width:100%;justify-content:center}}

.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.link-card{display:block;text-decoration:none;color:var(--text);border:1px solid rgba(22,214,163,.22);background:linear-gradient(135deg,rgba(22,214,163,.08),rgba(18,20,28,.95));border-radius:22px;padding:20px;min-height:150px}
.link-card:hover{border-color:rgba(22,214,163,.55);transform:translateY(-1px)}
.link-card h3{font-size:25px;margin:0 0 10px}
.link-card p{color:var(--muted);line-height:1.75;margin:0}
.step-list{display:grid;gap:12px}
.step{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:18px;padding:16px;line-height:1.8}
.step b{color:#9dffe2}
.contact-box{border:1px solid rgba(56,189,248,.24);background:rgba(56,189,248,.08);border-radius:22px;padding:20px;line-height:1.9}
.contact-box strong{color:#fff}


.delete-tools{border:1px solid rgba(251,113,133,.25);background:rgba(251,113,133,.06);border-radius:22px;padding:18px;margin:18px 0}
.delete-tools h3{margin:0 0 8px;font-size:24px}
.delete-tools .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.delete-tools input{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.28);color:#fff;border-radius:15px;padding:12px;font-weight:800}


.preview-note{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:22px;padding:18px;line-height:1.75;margin:16px 0}
.flow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.flow-step{border:1px solid rgba(22,214,163,.18);background:rgba(22,214,163,.06);border-radius:20px;padding:18px;cursor:pointer}
.flow-step b{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:rgba(22,214,163,.18);margin-bottom:10px}
.clean-title{font-size:clamp(28px,5vw,52px);line-height:1.12}


/* AI預測系統 正式會員數據系統：只調整視覺，不改資料與功能 */

}
body{

.status.loss{

.status.pending{
  background:#fff3f8 !important;

}
.pill,.tag{
  background:#fff0f6 !important;
  color:#c65489 !important;
  border-color:rgba(255,143,194,.20) !important;
}

  --panel:#ffffff !important;
  --panel2:#fff4f9 !important;
  --line:rgba(214,92,142,.24) !important;
  --text:#4b2f3f !important;

function taiwanDate(offsetDays=0){
  const now = new Date();
  const taipeiNow = new Date(now.toLocaleString("en-US", {timeZone:"Asia/Taipei"}));
  taipeiNow.setDate(taipeiNow.getDate()+offsetDays);
  const y = taipeiNow.getFullYear();
  const m = String(taipeiNow.getMonth()+1).padStart(2,"0");
  const d = String(taipeiNow.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
const today = () => taiwanDate(0);
const tomorrow = () => taiwanDate(1);

async function rpc(name, body={}){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Supabase 設定不足");
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY},
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok) throw new Error((data && (data.message || data.details || data.hint)) || text || res.statusText);
  return data;
}
async function rpcAny(list){
  let last;
  for(const item of list){
    try{ return await rpc(item.name,item.body||{}); }catch(e){ last=e; }
  }
  throw last || new Error("所有函式呼叫失敗");
}
function normalize(p){
  return {
    id:p.id, eventNo:p.event_no||p.eventNo||"", date:p.match_date||p.date||"", time:p.match_time||p.time||"",
    publishDate:p.publish_date||p.publishDate||"", sport:p.sport||"", league:p.league||"",
    away:p.away_team||p.away||"", home:p.home_team||p.home||"", market:p.market||"", pick:p.pick||"",
    odds:p.odds||"", status:p.status||"未開賽", visibility:p.visibility||"paid", module:p.module||"member_today",
    analysis:p.analysis||"", review:p.review||"", parlayGroup:p.parlay_group||p.parlayGroup||"",
    resultScore:p.result_score||p.resultScore||"", createdAt:p.created_at||"", updatedAt:p.updated_at||""
  };
}
function statusClass(p){ return ["過關","過"].includes(p.status) ? "win" : ["未過","沒過","失敗"].includes(p.status) ? "loss" : "pending"; }
function isWin(p){ return ["過關","過"].includes(p.status); }
function isLoss(p){ return ["未過","沒過","失敗"].includes(p.status); }
function isSettled(p){ return isWin(p)||isLoss(p); }
function matchName(p){ return `${p.away||"客隊"} vs ${p.home||"主隊"}`; }
function displayDate(d){ if(!d) return "-"; const a=String(d).split("-"); return a.length===3 ? `${Number(a[1])}/${Number(a[2])}` : d; }
function fullTime(p){ return `${p.date||"-"} ${p.time||""}`.trim(); }
function publishTime(p){ return p.publishDate ? `${p.publishDate} 發布` : p.createdAt ? new Date(p.createdAt).toLocaleString("zh-TW") : "尚未記錄"; }
function latestDate(list){ const ds=list.map(p=>p.date).filter(Boolean).sort(); return ds.length ? ds[ds.length-1] : today(); }
function memberDisplayDate(list){
  const ds=[...new Set(list.map(p=>p.date).filter(Boolean))].sort();
  const twToday=today();
  if(ds.includes(twToday)) return {date:twToday, mode:"today"};
  const future=ds.find(d=>d>twToday);
  if(future) return {date:future, mode:"future"};
  return {date:"", mode:"none"};
}
function memberDayRows(list){
  const info=memberDisplayDate(list);
  return {info, day: info.date ? list.filter(p=>p.date===info.date) : []};
}
function memberDateHero(info, title){
  const twToday=today();
  if(info.mode==="today") return `<section class="hero"><div class="pill">台灣時間｜${displayDate(twToday)}</div><h2>${displayDate(info.date)} ${title}</h2><p>目前顯示今日實際開賽賽事。</p></section>`;
  if(info.mode==="future") return `<section class="hero"><div class="pill">台灣時間｜${displayDate(twToday)}｜提前發布</div><h2>${displayDate(info.date)} ${title}</h2><p>今日尚無實際開賽資料，系統自動顯示下一個已發布賽事日，請以實際開賽日期為準。</p></section>`;
  return `<section class="hero"><div class="pill">台灣時間｜${displayDate(twToday)}</div><h2>${displayDate(twToday)} 今日資料尚未發布</h2><p>目前沒有今日或未來已發布賽事。請等待後台更新會員資料。</p></section>`;
}
function marketKind(p){ const m=String(p.market||"").trim(); if(!m) return "其他"; if(m.includes("不讓")||m.includes("PK")) return "不讓分"; if(m.includes("大小")||m.includes("總分")||/^大|^小/.test(p.pick||"")) return "大小分"; if(m.includes("讓分")) return "讓分"; return m; }
function visibleRows(){ return rows.filter(p=>p.visibility!=="hidden"); }
function memberRows(){ return visibleRows().filter(p=>["paid","member","付費會員"].includes(p.visibility)); }

async function loadData(){
  loadError = "";
  if(memberCode && memberPass){
    try{
      const info = await rpcAny([
        {name:"member_access_info_v55",body:{p_code:memberCode,p_password:memberPass}},
        {name:"member_access_info_v54",body:{p_code:memberCode,p_password:memberPass}},
        {name:"member_access_info",body:{p_code:memberCode,p_password:memberPass}}
      ]);
      memberInfo = Array.isArray(info) ? info[0] : info;
      isMember = !!(memberInfo && (memberInfo.allowed || memberInfo.has_access));
      if(isMember){
        const data = await rpcAny([
          {name:"get_member_predictions_v55",body:{p_code:memberCode,p_password:memberPass}},
          {name:"get_member_predictions_v54",body:{p_code:memberCode,p_password:memberPass}},
          {name:"get_member_predictions",body:{p_code:memberCode,p_password:memberPass}}
        ]);
        rows = (Array.isArray(data)?data:[]).map(normalize);
      }
    }catch(e){ loadError = "會員資料讀取失敗：" + e.message; isMember=false; }
  }
  if(isAdmin && adminPassword){
    try{
      const data = await rpcAny([
        {name:"admin_list_predictions_v55",body:{p_admin_password:adminPassword}},
        {name:"admin_list_predictions_v54",body:{p_admin_password:adminPassword}},
        {name:"admin_list_predictions_v53",body:{p_admin_password:adminPassword}}
      ]);
      rows = (Array.isArray(data)?data:[]).map(normalize);
    }catch(e){ loadError = "後台賽事讀取失敗：" + e.message; }
    try{
      const codes = await rpcAny([
        {name:"admin_list_activation_codes_v55",body:{p_admin_password:adminPassword}},
        {name:"admin_list_activation_codes",body:{p_admin_password:adminPassword}}
      ]);
      activationCodes = Array.isArray(codes)?codes:[];
    }catch(e){ /* keep empty */ }
  }
  if(!isMember && !isAdmin){
    // Public side never hangs. It only uses local public shell unless public rows exist through future RPC.
    rows = [];
  }
}

function statData(list){
  const settled=list.filter(isSettled), w=settled.filter(isWin).length, l=settled.filter(isLoss).length, pend=list.length-settled.length;
  const rate=settled.length?Math.round(w/settled.length*1000)/10:0;
  return {total:list.length,settled:settled.length,w,l,pend,rate};
}
function dashboard(title,list){
  const s=statData(list), singles=list.filter(p=>p.module==="main_single"), parlays=list.filter(p=>p.module==="parlay_combo");
  const bySport={}, byMarket={};
  list.forEach(p=>{ (bySport[p.sport||"其他"] ||= []).push(p); (byMarket[marketKind(p)] ||= []).push(p); });
  const seg=(name,arr)=>{ const a=statData(arr); return `<div class="card"><h3>${esc(name)}</h3><p class="muted">已結算 ${a.settled}｜過 ${a.w}｜未過 ${a.l}</p><div class="meter"><div style="width:${Math.min(100,a.rate)}%"></div></div><p class="muted">勝率 ${a.rate}%</p></div>`; };
  return `<section class="hero"><div class="pill">AI預測系統｜透明戰績</div><h2>${esc(title)}</h2><p>只呈現整體結果與分項表現，不把 30 場逐場明細塞滿畫面。失利原因集中在「失利覆盤」。</p></section>
  <div class="dashboard">
    <div class="metric"><b>${s.total}</b><span>總資料</span></div>
    <div class="metric"><b>${s.pend}</b><span>未開賽</span></div>
    <div class="metric"><b>${s.w}/${s.l}</b><span>過關 / 未過</span></div>
    <div class="metric"><b>${s.rate}%</b><span>已結算勝率</span><div class="meter"><div style="width:${Math.min(100,s.rate)}%"></div></div></div>
  </div>
  <section class="panel"><div class="panel-head"><div><h2>分項表現</h2><p class="muted">主推、串關、球種與盤口分類。</p></div></div><div class="pad grid">
    ${seg("主推單場",singles)}${seg("串關關卡",parlays)}${Object.entries(bySport).map(([k,v])=>seg(k,v)).join("")}${Object.entries(byMarket).map(([k,v])=>seg(k,v)).join("")}
  </div></section>`;
}
function kpi(label,value){ return `<div class="kpi"><span>${esc(label)}</span><b>${esc(value||"-")}</b></div>`; }
function card(p,admin=false){
  return `<article class="card">
    <div class="card-top"><div><h3>${esc(p.pick||matchName(p))}</h3><div class="meta">${esc(p.league||p.sport||"-")}｜${esc(matchName(p))}｜編號 ${esc(p.eventNo||"待補")}</div></div><span class="status ${statusClass(p)}">${esc(p.status)}</span></div>
    <div class="kpis">
      ${kpi("實際開賽時間",fullTime(p))}
      ${kpi("盤口",p.market)}
      ${kpi("推薦方向",p.pick)}
      ${kpi("參考賠率",p.odds)}
      ${p.resultScore?kpi("賽果",p.resultScore):""}
    </div>
    <div class="tags"><span class="tag green">${p.module==="main_single"?"主推單場":p.module==="parlay_combo"?"串關配置":"會員資料"}</span><span class="tag">${esc(p.sport||"-")}</span><span class="tag">${esc(marketKind(p))}</span></div>
    ${p.analysis?`<details class="details"><summary>查看賽前分析</summary><div>${esc(p.analysis)}</div></details>`:""}
    ${p.review?`<details class="details"><summary>${isLoss(p)?"查看失利覆盤":"查看賽後紀錄"}</summary><div>${esc(p.review)}</div></details>`:""}
    ${admin?`<div class="actions" style="padding:12px 0 0"><button class="btn primary" onclick="settle('${esc(p.id)}','過關')">過關＋覆盤</button><button class="btn danger" onclick="settle('${esc(p.id)}','未過')">未過＋覆盤</button><button class="btn ghost" onclick="editRow('${esc(p.id)}')">載入修改</button><button class="btn warn" onclick="hideRow('${esc(p.id)}')">隱藏</button><button class="btn danger" onclick="deleteRow('${esc(p.id)}')">刪除</button></div>`:""}
  </article>`;
}
function groupName(p){ if(p.parlayGroup) return p.parlayGroup; const e=String(p.eventNo); if(["109","130","128"].includes(e)) return "5/2 A｜3關串關｜總賠率 4.46"; if(["110","116","125"].includes(e)) return "5/2 B｜3關串關｜總賠率 3.47"; return `${p.date||"未定日期"}｜串關組合`; }
function parlayGroups(list){ const m={}; list.filter(p=>p.module==="parlay_combo").forEach(p=>(m[groupName(p)]||=[]).push(p)); return Object.entries(m).map(([name,items])=>{items.sort((a,b)=>String(a.time).localeCompare(String(b.time))); return {name,items};}); }
function oddsProduct(items){ const ns=items.map(p=>Number(String(p.odds).replace(/[^\d.]/g,""))).filter(Boolean); return ns.length?ns.reduce((a,b)=>a*b,1).toFixed(2):"-"; }
function parlayCard(g,admin=false){
  const s=statData(g.items), cls=s.l?"loss":s.pend?"pending":"win";
  return `<section class="parlay"><h3>${esc(g.name)}</h3><p class="muted">這一組以串關方式呈現，會員可直接看出哪幾關串在一起。</p>
  <div class="tags"><span class="tag green">${g.items.length} 關串關</span><span class="tag">估算總賠率 ${oddsProduct(g.items)}</span><span class="status ${cls}">${s.l?`${s.w}/${g.items.length} 過｜整組未過`:s.pend?`${s.pend} 關未開賽`:`${s.w}/${g.items.length} 過｜整組過關`}</span></div>
  ${g.items.map((p,i)=>`<div class="leg"><div class="leg-no">第 ${i+1} 關</div><div><b>${esc(p.eventNo)}｜${esc(p.pick)}</b><br><span class="muted">開賽：${esc(fullTime(p))}｜${esc(matchName(p))}｜${esc(p.market)}</span></div><div><span class="status ${statusClass(p)}">${esc(p.status)}</span><br><b>${esc(p.odds)}</b></div></div>`).join("")}

  </section>`;
}

function memberPage(kind){
  const list=memberRows();
  const {info, day}=memberDayRows(list);
  const heroTitle = kind==="member_single" ? "｜主推單場" : kind==="member_parlay" ? "｜串關配置" : "｜會員資料總覽";
  const hero=memberDateHero(info, heroTitle);
  if(!day.length) return `${hero}<div class="empty">目前沒有符合台灣日期的會員資料。</div>`;
  if(kind==="member_single") return `${hero}${renderList(day.filter(p=>p.module==="main_single"))}`;

}

  try{
    const n = await rpcAny([{name:"admin_delete_predictions_by_group_v59",body:{p_admin_password:adminPassword,p_parlay_group:g}}]);
    alert(`已刪除 ${n} 筆資料。`);
    await loadData(); render();
  }catch(e){ alert("清除串關組失敗："+e.message+"\n請確認已執行 supabase_v59_delete_manage.sql。"); }
}

function adminSettle(){ const list=visibleRows().filter(p=>["未開賽","待開賽","過關","未過"].includes(p.status)); return `<section class="hero"><h2>賽後結算中心</h2><p>比賽結束後在這裡標記過關或未過，未過必須補覆盤。</p></section><div class="pad">${renderList(list,true)}</div>`; }
function adminMembers(){
  return `<section class="panel"><div class="panel-head"><div><h2>新增會員</h2><p class="muted">建立 10 天、30 天或其他天數會員。會員列表可續費或改永久。</p></div></div><div class="form"><label>啟用碼<input id="c_code" placeholder="PAP-001"></label><label>會員密碼<input id="c_pass" placeholder="自訂或隨機"></label><label>有效天數<input id="c_days" type="number" value="10"></label><label>備註<input id="c_note" placeholder="IG / TG / 方案 / 收款狀態"></label></div><div class="actions"><button class="btn primary" onclick="createCode()">建立 / 更新會員</button></div></section>${memberList()}`;
}
function codeDays(c){ if(!c.expires_at) return 0; const d=new Date(c.expires_at); if(d.getFullYear()>=2099) return 99999; return Math.ceil((d-new Date())/86400000); }
function permanent(c){ return String(c.code).toUpperCase()==="VIP001" || String(c.note||"").includes("永久") || new Date(c.expires_at).getFullYear()>=2099; }
function memberList(){
  return `<section class="panel"><div class="panel-head"><div><h2>會員權限管理表</h2><p class="muted">搜尋、續 10 天、續 30 天、改永久、改備註、停用。</p></div><div class="muted">共 ${activationCodes.length} 組</div></div><div class="searchbar"><input id="memberSearch" placeholder="搜尋啟用碼 / IG / TG / 備註" oninput="render()"></div><div class="member-grid">${activationCodes.filter(c=>{ const q=($("memberSearch")?.value||"").toLowerCase(); return !q || [c.code,c.note,c.id].join(" ").toLowerCase().includes(q); }).map(c=>`<div class="member-card"><div class="card-top"><div><h3>${esc(c.code)}</h3><p class="meta">${esc(c.id||"")}</p></div><span class="status ${!c.is_active?'loss':permanent(c)||codeDays(c)>2?'win':'pending'}">${!c.is_active?'已停用':permanent(c)?'永久會員':'剩 '+codeDays(c)+' 天'}</span></div><div class="kpis">${kpi("到期時間",permanent(c)?"永久會員":new Date(c.expires_at).toLocaleString("zh-TW"))}${kpi("備註",c.note||"-")}</div><div class="actions" style="padding:0"><button class="btn primary" onclick="extendCode('${esc(c.code)}',10)">續 10 天</button><button class="btn primary" onclick="extendCode('${esc(c.code)}',30)">續 30 天</button><button class="btn warn" onclick="setPermanent('${esc(c.code)}')">改永久</button><button class="btn ghost" onclick="editNote('${esc(c.code)}','${esc(String(c.note||"").replace(/'/g,"\\'"))}')">改備註</button><button class="btn danger" onclick="deactivateCode('${esc(c.code)}')">停用</button></div></div>`).join("") || `<div class="empty">目前沒有會員資料，或 SQL 尚未提供會員列表函式。</div>`}</div></section>`;
}
async function createCode(){ try{ await rpcAny([{name:"admin_create_activation_code_v58",body:{p_admin_password:adminPassword,p_code:getVal("c_code"),p_member_password:getVal("c_pass"),p_days:Number(getVal("c_days")||10),p_note:getVal("c_note")}},{name:"admin_create_activation_code_v55",body:{p_admin_password:adminPassword,p_code:getVal("c_code"),p_member_password:getVal("c_pass"),p_days:Number(getVal("c_days")||10),p_note:getVal("c_note")}},{name:"admin_create_activation_code",body:{p_admin_password:adminPassword,p_code:getVal("c_code"),p_member_password:getVal("c_pass"),p_days:Number(getVal("c_days")||10),p_note:getVal("c_note")}}]); alert("會員已建立 / 更新"); await loadData(); render(); }catch(e){ alert("建立失敗："+e.message); } }
async function extendCode(code,days){ try{ await rpcAny([{name:"admin_extend_member_code_v55",body:{p_admin_password:adminPassword,p_code:code,p_days:days}},{name:"admin_extend_member_code_v54",body:{p_admin_password:adminPassword,p_code:code,p_days:days}}]); alert("已續費 "+days+" 天"); await loadData(); render(); }catch(e){ alert("續費失敗："+e.message); } }
async function setPermanent(code){ try{ await rpcAny([{name:"admin_set_member_permanent_v55",body:{p_admin_password:adminPassword,p_code:code}},{name:"admin_set_member_permanent_v54",body:{p_admin_password:adminPassword,p_code:code}}]); alert("已改永久會員"); await loadData(); render(); }catch(e){ alert("設定失敗："+e.message); } }
async function editNote(code,current){ const note=prompt("修改會員備註",current||""); if(note===null)return; try{ await rpcAny([{name:"admin_update_member_note_v55",body:{p_admin_password:adminPassword,p_code:code,p_note:note}},{name:"admin_update_member_note_v54",body:{p_admin_password:adminPassword,p_code:code,p_note:note}}]); alert("備註已更新"); await loadData(); render(); }catch(e){ alert("修改失敗："+e.message); } }
async function deactivateCode(code){ try{ await rpcAny([{name:"admin_deactivate_activation_code",body:{p_admin_password:adminPassword,p_code:code}}]); alert("已停用"); await loadData(); render(); }catch(e){ alert("停用失敗："+e.message); } }

function adminImport(){
  return `<section class="panel"><div class="panel-head"><div><h2>批量匯入賽事 / 戰績</h2><p class="muted">可貼上 JSON 一次匯入。你可以自己依格式貼入；若每天把賽事傳給我，我也可以幫你整理成可直接貼上的 JSON。</p></div></div><div class="form"><label>戰績 JSON<textarea id="bulkJson" placeholder="貼上 JSON 陣列"></textarea></label></div><div class="actions"><button class="btn primary" onclick="importOfficial()">V74 Final 一鍵重整 5/2 已結算資料</button><button class="btn ghost" onclick="$('bulkJson').value=JSON.stringify(OFFICIAL_0502,null,2)">載入 V74 Final 正式 JSON</button><button class="btn primary" onclick="bulkImport()">匯入目前 JSON</button><button class="btn ghost" onclick="systemCheck()">V74 Final 上線檢查</button></div></section>
  <section class="panel"><div class="panel-head"><div><h2>資料刪除管理</h2><p class="muted">用來清除匯入錯誤、重複日期或不要的串關組。單筆刪除也可在賽事卡片按「刪除」。</p></div></div>
    <div class="pad">
      <div class="delete-tools">
        <h3>清除指定日期資料</h3>
        <p class="muted">例如今天匯入錯日期，可以一次刪除該日期所有資料。</p>
        <div class="row"><input id="clear_date" type="date"><button class="btn danger" onclick="clearDateRows()">刪除該日期全部賽事</button></div>
      </div>
      <div class="delete-tools">
        <h3>清除指定串關組</h3>
        <p class="muted">請輸入完整串關組合名稱，例如：5/2 A｜3關串關｜總賠率 4.46</p>
        <div class="row"><input id="clear_group" placeholder="串關組合名稱"><button class="btn danger" onclick="clearGroupRows()">刪除該串關組</button></div>
      </div>
    </div>
  </section>`;
}
async function importOfficial(){ if(!confirm("確認清理舊 5/2 資料並匯入正式資料？")) return; try{ await rpcAny([{name:"admin_cleanup_official_may02_v55",body:{p_admin_password:adminPassword}},{name:"admin_cleanup_official_may02_v54",body:{p_admin_password:adminPassword}}]); }catch(e){} $("bulkJson").value=JSON.stringify(OFFICIAL_0502,null,2); await bulkImport(); }
async function bulkImport(){ let data; try{data=JSON.parse($("bulkJson").value)}catch(e){return alert("JSON 格式錯誤："+e.message)}; let ok=0,fail=0,errs=[]; for(const r of data){ try{ await rpcAny([{name:"admin_save_prediction_v55",body:{p_admin_password:adminPassword,p_data:r}},{name:"admin_save_prediction_v54",body:{p_admin_password:adminPassword,p_data:r}}]); ok++; }catch(e){fail++; errs.push((r.event_no||r.pick||"?")+"："+e.message)} } alert(`匯入完成：成功 ${ok}，失敗 ${fail}`+(errs.length?"\n"+errs.join("\n"):"")); await loadData(); render(); }
async function systemCheck(){ try{ const r=await rpcAny([{name:"admin_system_check_v55",body:{p_admin_password:adminPassword}},{name:"admin_system_check_v54",body:{p_admin_password:adminPassword}}]); alert("上線檢查：\n"+JSON.stringify(Array.isArray(r)?r[0]:r,null,2)); }catch(e){ alert("檢查失敗："+e.message); } }
function adminStatus(){ return `<section class="panel"><div class="panel-head"><h2>系統狀態</h2></div><div class="form"><label>今日資料狀態<select id="s_status"><option>ready</option><option>整理中</option><option>已更新</option></select></label><label>維護模式<select id="s_maint"><option value="false">關閉</option><option value="true">開啟</option></select></label><label>維護訊息<textarea id="s_msg">系統資料維護中，請稍後回來查看。</textarea></label></div><div class="actions"><button class="btn primary" onclick="alert('狀態設定保留為後續接資料庫，現在不再讓前台卡在資料整理中。')">儲存系統狀態</button></div></section>`; }

async function toggleAdmin(){ if(isAdmin){ isAdmin=false; adminPassword=""; localStorage.removeItem("pap_admin_password"); page="home"; await loadData(); render(); return; } const p=prompt("請輸入後台密碼"); if(!p)return; adminPassword=p; isAdmin=true; localStorage.setItem("pap_admin_password",p); page="admin_home"; await loadData(); render(); }
function toggleMember(){ if(isMember){ isMember=false; memberCode=""; memberPass=""; memberInfo=null; localStorage.removeItem("pap_member_code"); localStorage.removeItem("pap_member_pass"); page="home"; loadData().then(render); } else $("memberModal").classList.add("open"); }
function closeModal(id){ $(id).classList.remove("open"); }
async function memberLogin(){ memberCode=$("loginCode").value.trim(); memberPass=$("loginPass").value.trim(); localStorage.setItem("pap_member_code",memberCode); localStorage.setItem("pap_member_pass",memberPass); closeModal("memberModal"); await loadData(); page=isMember?"member_home":"home"; render(); if(!isMember) alert(loadError || "會員登入失敗"); }

function render(){
  updateUser(); updateNav();
  let out="";
  if(isAdmin){
    if(page==="admin_builder") out=adminBuilder();
    else if(page==="admin_settle") out=adminSettle();
    else if(page==="admin_members") out=adminMembers();
    else if(page==="admin_import") out=adminImport();
    else if(page==="admin_status") out=adminStatus();
    else if(page==="member_today"||page==="member_single"||page==="member_parlay") out=memberPage(page);
    else if(page==="record") out=recordPage(false);
    else if(page==="review") out=recordPage(true);
    else if(page==="guide") out=guidePage();
    else if(page==="betting") out=bettingPage();
    else if(page==="scores") out=scoresPage();
    else if(page==="contact") out=contactPage();
    else out=adminHome();
  } else if(isMember){
    if(page==="member_today"||page==="member_single"||page==="member_parlay") out=memberPage(page);
    else if(page==="record") out=recordPage(false);
    else if(page==="review") out=recordPage(true);
    else if(page==="guide") out=guidePage();
    else if(page==="betting") out=bettingPage();
    else if(page==="scores") out=scoresPage();
    else if(page==="contact") out=contactPage();
    else out=memberHome();
  } else {
    if(page==="public_record") out=publicRecord();
    else if(page==="guide") out=guidePage();
    else if(page==="betting") out=bettingPage();
    else if(page==="scores") out=scoresPage();
    else if(page==="contact") out=contactPage();
    else out=pageHome();
  }
  if(loadError && (isMember||isAdmin)) out = `<div class="error">${esc(loadError)}</div>` + out;
  $("root").innerHTML=out;
}
(async function init(){
  if(location.hash==="#admin") $("adminBtn").style.display="inline-flex";
  await loadData();
  if(isMember) page="member_home";
  render();
})();
</script>
</body>
</html>
